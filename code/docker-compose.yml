version: '3.8'

services:
  # 1. MySQL 8 Database
  mysql:
    image: mysql:8.0
    container_name: qr_order_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: qr_order_db
      MYSQL_USER: qr_user
      MYSQL_PASSWORD: qr_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - qr_network
    command: --default-authentication-plugin=mysql_native_password

  # 2. Redis 7 (Cache, Queue, Pub/Sub)
  redis:
    image: redis:7-alpine
    container_name: qr_order_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - qr_network

  # 3. Laravel 11 Backend API
  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: qr_order_backend
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_NAME: "QR Order & KDS"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: qr_order_db
      DB_USERNAME: qr_user
      DB_PASSWORD: qr_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: 1001
      REVERB_APP_KEY: qr_reverb_key
      REVERB_APP_SECRET: qr_reverb_secret
      REVERB_HOST: localhost
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - qr_network
    command: php artisan serve --host=0.0.0.0 --port=8000

  # 4. Laravel Reverb WebSocket Server
  reverb:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: qr_order_reverb
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - backend
      - redis
    networks:
      - qr_network
    command: php artisan reverb:start --host=0.0.0.0 --port=8080

  # 5. Laravel Queue Worker (FP-Growth, PDF, Notifications)
  queue:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: qr_order_queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - backend
      - redis
    networks:
      - qr_network
    command: php artisan queue:work redis --sleep=3 --tries=3

  # 6. Next.js 15 Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
    container_name: qr_order_frontend
    restart: unless-stopped
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_REVERB_KEY: qr_reverb_key
      NEXT_PUBLIC_REVERB_HOST: localhost
      NEXT_PUBLIC_REVERB_PORT: 8080
      NEXT_PUBLIC_REVERB_SCHEME: http
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
      - reverb
    networks:
      - qr_network
    command: npm run dev

networks:
  qr_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
